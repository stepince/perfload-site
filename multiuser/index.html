  <style>
    :root {
      --bg: #0b0d14;
      --panel: #12151f;
      --text: #e8eaf0;
      --muted: #9aa0ae;
      --accent: #4f46e5;
      --border: #23273a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
    }
    header a {
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }
    header nav {
      margin-left: auto;
    }
    header nav a {
      color: var(--muted);
      font-weight: 400;
      font-size: 14px;
      margin-left: 16px;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h2 {
      font-size: 22px;
      margin-top: 40px;
    }
    p, li {
      color: var(--muted);
    }
    a {
      color: #818cf8;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 3px 10px;
      white-space: nowrap;
    }
    .no-icon {
      position: relative;
      display: inline-block;
    }
    .no-icon svg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 108%;
      height: 150%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-top: 16px;
    }
    code {
      background: #1a1e2e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    ul {
      padding-left: 20px;
    }
    iframe {
      width: 100%;
      height: 480px;
      border: none;
      border-radius: 8px;
      background: #fff;
    }
    footer {
      text-align: center;
      color: var(--muted);
      padding: 32px;
      font-size: 14px;
      border-top: 1px solid var(--border);
    }
    ol {
      padding-left: 20px;
    }
    h3 {
      font-size: 17px;
      margin-top: 24px;
      color: var(--text);
    }
    .prompt {
      margin: 0;
      color: var(--text);
      font-style: italic;
    }
    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .card.wide {
      padding: 4px;
      overflow: hidden;
    }
    .card.wide iframe {
      display: block;
    }
    @media (min-width: 1000px) {
      .card.wide { margin-left: -60px; margin-right: -60px; }
    }
  </style>
